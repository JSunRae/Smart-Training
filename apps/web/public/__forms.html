<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smart Training enquiry form</title>
  </head>
  <body>
    <form name="smart-training-enquiry" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="smart-training-enquiry" />
      <input type="hidden" name="source_page" />
      <input type="hidden" name="source_cta" />
      <input type="hidden" name="use_case" />
      <input type="hidden" name="consent_version" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <input type="text" name="role" />
      <select name="practice_focus">
        <option value="sales-conversation">Sales conversation</option>
      </select>
      <textarea name="practice_focus_detail"></textarea>
      <textarea name="current_approach"></textarea>
      <select name="next_step">
        <option value="focused-pilot">Discuss a focused pilot</option>
      </select>
      <input type="checkbox" name="enquiry_acknowledgement" value="accepted" />
      <input type="text" name="website" />
    </form>
  </body>
</html>
